name: Generar PDFs de notas (formato paper)

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'layouts/**'
      - 'assets/css/extended/print-paper.css'
      - 'scripts/generate-pdf.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo (no el shallow-clone de 1 commit por
          # defecto) -- el fetch + rebase del paso de más abajo, para
          # reintentar el push si choca con otro push en simultáneo,
          # necesita poder ver el historial común con origin/main.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Hugo (build descartable, solo para leer el HTML)
        run: hugo

      - name: Instalar Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generar PDFs
        run: node scripts/generate-pdf.mjs

      - name: Commit y push si hay PDFs nuevos o cambiados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/files/pdf/
          if git diff --cached --quiet; then
            echo "Sin cambios en los PDFs, no hago commit."
            exit 0
          fi
          git commit -m "pdf: regenerar PDF(s) de nota(s)"

          # El push puede chocar si el remoto se movió mientras corría este
          # job (otro push llegando casi al mismo tiempo -- pasa seguido en
          # este repo). Antes de reintentar, "git rebase -X ours" pone este
          # commit arriba de lo último del remoto y, si justo hay conflicto
          # en un PDF, se queda con el que se acaba de generar acá (es la
          # versión correcta, construida desde el mismo código que ya está
          # en el remoto). Reintenta varias veces por si el push vuelve a
          # perder la carrera.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X ours origin/main && git push origin HEAD:main; then
              echo "Push OK (intento $i)."
              exit 0
            fi
            echo "Intento $i de push falló (probablemente otro push en simultáneo) -- reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 3))
          done

          echo "No se pudo pushear los PDFs regenerados después de varios intentos."
          exit 1