name: Generar PDFs de notas (formato paper)

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'layouts/**'
      - 'assets/css/extended/print-paper.css'
      - 'scripts/generate-pdf.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Hugo (build descartable, solo para leer el HTML)
        run: hugo

      - name: Instalar Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generar PDFs
        run: node scripts/generate-pdf.mjs

      - name: Commit y push si hay PDFs nuevos o cambiados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/files/pdf/
          if git diff --cached --quiet; then
            echo "Sin cambios en los PDFs, no hago commit."
          else
            git commit -m "pdf: regenerar PDF(s) de nota(s)"
            git push
          fi
