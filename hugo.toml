baseURL = "https://profe.lemeit.ar/"

defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false
languageCode = "es-AR"
title = "Luciano Lamaita"
copyright = "© 2026 [Luciano Lamaita](mailto:info@lemeit.ar)"
theme = "PaperMod"

mainSections = []

[params]
  author = "Luciano Lamaita"

  [params.footer]
    text = "[Wiki de proyectos](https://wiki.lemeit.ar/)"
  description = "Ingeniero | Profesor | Saladillo, Buenos Aires"
  dateFormat = "02/01/2006"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  math = true

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"

  [params.homeInfoParams]
      Title = "Hola, soy Luciano 👋"
      Content = """
  Ingeniero químico · Profesor de física y química en Saladillo, Buenos Aires.
  Comparto materiales educativos y proyectos de tecnología aplicada al ambiente,
  la simulación científica y la gestión territorial.
    """

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lemeit"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/lemeitok"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/lemeit"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/llamaita/"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/lemeit.bsky.social"

[languages.es]
  languageName = "Español"
  languageCode = "es-AR"
  weight = 1
  [[languages.es.menu.main]]
    name = "Proyectos"
    url = "/projects/"
    weight = 1
  [[languages.es.menu.main]]
    name = "Apuntes"
