baseURL = "https://profe.lemeit.ar/"

defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false
locale = "es-AR"
title = "Luciano Lamaita"
copyright = "© 2026 [Luciano Lamaita](mailto:info@lemeit.ar)"
theme = "PaperMod"

mainSections = []

[params]
  author = "Luciano Lamaita"

  [params.footer]
    text = "[Wiki de proyectos](https://wiki.lemeit.ar/)"
  description = "Ingeniero | Docente | Saladillo, Buenos Aires"
  dateFormat = "02/01/2006"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  math = true

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"

  [params.homeInfoParams]
      Title = "Hola, soy Luciano 👋"
      Content = """
  Ingeniero químico y profesor de Física y Química en Saladillo, Buenos Aires.
  Comparto materiales educativos y proyectos de tecnología aplicada al ambiente,
  la simulación científica y la gestión territorial.
    """

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lemeit"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/lemeitok"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/lemeit"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/llamaita/"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/lemeit.bsky.social"

[languages.es]
  label = "Español"
  locale = "es-AR"
  weight = 1
  [[languages.es.menu.main]]
    name = "Proyectos"
    url = "/projects/"
    weight = 1
  [[languages.es.menu.main]]
    name = "Apuntes"
    url = "/notes/"
    weight = 2
  [[languages.es.menu.main]]
    name = "Sobre mí"
    url = "/about/"
    weight = 3

[languages.en]
  label = "English"
  locale = "en-GB"
  weight = 2
  [languages.en.params]
    description = "Chemical engineer and Physics and Chemistry teacher in Saladillo, Argentina"
    [languages.en.params.footer]
      text = "[Project wiki](https://wiki.lemeit.ar/en/)"
    [languages.en.params.homeInfoParams]
      Title = "Hi, I'm Luciano 👋"
      Content = "Chemical engineer and Physics and Chemistry teacher in Saladillo, Buenos Aires, Argentina. I share educational resources and projects applying technology to environmental monitoring, scientific simulation and territorial management."
  [[languages.en.menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 1
  [[languages.en.menu.main]]
    name = "Notes (Spanish)"
    url = "/notes/"
    weight = 2
    [languages.en.menu.main.params]
      spanish = true
  [[languages.en.menu.main]]
    name = "About me"
    url = "/about/"
    weight = 3

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", "date"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]

[outputFormats.PDFManifest]
  mediaType = "application/json"
  baseName = "pdf-manifest"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "PDFManifest"]
