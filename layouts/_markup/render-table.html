{{- $bigler := strings.HasPrefix .Page.RelPermalink "/notes/notas-fisica/" -}}
{{- if $bigler }}
<div class="bigler-table-scroll" role="region" aria-label="Tabla {{ add .Ordinal 1 }}" tabindex="0">
{{- end }}
<table
  {{- range $k, $v := .Attributes }}
    {{- if $v }}{{ printf " %s=%q" $k $v | safeHTMLAttr }}{{ end }}
  {{- end }}>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th scope="col"{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
{{- if $bigler }}
</div>
{{- end }}
