{{- define "main" }}
<article class="post-single profile-page">
  <header class="post-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="post-title">{{ .Title }}</h1>
    {{ with .Params.profileLabel }}<p class="profile-label">{{ . }}</p>{{ end }}
  </header>
  <nav class="profile-nav" aria-label="Perfil de Luciano Lamaita">
    <a href="#lo-que-hago">Lo que hago</a>
    <a href="#curriculum-vitae">CV en español e inglés</a>
    <a href="#trayectoria">Trayectoria</a>
    <a href="#conversemos">Contacto</a>
  </nav>
  {{ if .Params.ShowToc }}{{ partial "toc.html" . }}{{ end }}
  <div class="post-content md-content profile-content">
    {{ partial "anchored_headings.html" .Content }}
  </div>
</article>
{{- end }}
