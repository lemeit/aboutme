<span id="obf-em" data-u="{{ .Get "u" }}" data-d="{{ .Get "d" }}"></span>
<script>
(function(){
  var e = document.getElementById('obf-em');
  if (e) {
    var a = document.createElement('a');
    a.href = 'mailto:' + e.dataset.u + '@' + e.dataset.d;
    a.textContent = e.dataset.u + '@' + e.dataset.d;
    e.appendChild(a);
  }
})();
</script>
