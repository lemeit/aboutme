<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
<title id="title">Física: bloque sobre plano inclinado con fuerzas</title>
<desc id="desc">Peso P vertical hacia abajo, normal N perpendicular al plano y tensión T paralela al plano hacia arriba.</desc>
<defs><marker id="arrow" markerWidth="4" markerHeight="4" refX="3.4" refY="2" orient="auto" markerUnits="userSpaceOnUse"><path d="M.5 .5 3.5 2 .5 3.5" fill="none" stroke="#9B3D00" stroke-width=".45" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g fill="none" stroke="#9B3D00" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 27h26V12Z" stroke-width="1"/>
<rect x="10" y="14.2" width="8" height="6" rx=".8" transform="rotate(-29.98 14 17.2)" fill="#FAF7F2" stroke-width="1"/>
<path d="M14 17.2v11.3" stroke-width=".32" marker-end="url(#arrow)"/>
<path d="M14 17.2 7.7 6.3" stroke-width=".32" marker-end="url(#arrow)"/>
<path d="M17.5 15.2l8.5-4.9" stroke-width=".32" marker-end="url(#arrow)"/>
</g>
<g fill="#9B3D00" font-family="Arial, sans-serif" font-size="3.5"><text x="17" y="30">P</text><text x="4" y="6.5">N</text><text x="27" y="10.5">T</text></g>
</svg>
